<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BikeMates">
  <!-- Fondo verde oscuro del sistema de diseño (trail-dark) con esquinas redondeadas. -->
  <rect width="64" height="64" rx="14" fill="#166534" />

  <!-- Bici blanca de trazo grueso: legible también en 16×16. -->
  <g
    transform="translate(8 14)"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="10.5" cy="22" r="8" />
    <circle cx="37.5" cy="22" r="8" />
    <!-- Cuadro: tubo inferior, tubo vertical del sillín y tubo superior. -->
    <path d="M10.5 22 L20 22 L26 10 L34 10 L37.5 22" />
    <path d="M20 22 L24 10" />
    <!-- Sillín. -->
    <path d="M22 9 L28 9" />
    <!-- Manillar. -->
    <path d="M34 10 L36 6 L40 6" />
  </g>
</svg>
